apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: keda-demo
  labels:
    app: queue-worker
spec:
  replicas: 0  # KEDA will manage this - start at 0 to demonstrate scale-from-zero
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      containers:
      - name: worker
        image: python:3.12-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install pika==1.3.2
          python3 -c '
          import pika
          import time
          import sys

          print("Worker starting...", flush=True)

          # Connect to RabbitMQ
          connection = pika.BlockingConnection(
              pika.ConnectionParameters(
                  host="rabbitmq",
                  credentials=pika.PlainCredentials("guest", "guest")
              )
          )
          channel = connection.channel()

          # Declare queue (idempotent)
          channel.queue_declare(queue="work-queue", durable=True)

          def callback(ch, method, properties, body):
              task_id = body.decode()
              print(f"[WORKER] Processing task: {task_id}", flush=True)
              time.sleep(5)  # Simulate 5 seconds of work
              print(f"[WORKER] Completed task: {task_id}", flush=True)
              ch.basic_ack(delivery_tag=method.delivery_tag)

          # Consume messages (1 at a time for better scaling)
          channel.basic_qos(prefetch_count=1)
          channel.basic_consume(queue="work-queue", on_message_callback=callback)

          print("Worker ready. Waiting for messages...", flush=True)
          channel.start_consuming()
          '
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queue-worker-scaler
  namespace: keda-demo
spec:
  scaleTargetRef:
    name: queue-worker
  minReplicaCount: 0           # Scale to zero when queue is empty
  maxReplicaCount: 10          # Maximum 10 workers
  pollingInterval: 15          # Check queue every 15 seconds
  cooldownPeriod: 60           # Wait 60s before scaling down

  triggers:
  - type: rabbitmq
    metadata:
      host: amqp://guest:guest@rabbitmq.keda-demo.svc.cluster.local:5672
      queueName: work-queue
      mode: QueueLength
      value: "5"               # Target: 5 messages per worker pod
